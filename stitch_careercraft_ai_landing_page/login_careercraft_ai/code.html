<div class="fixed bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-secondary/5 blur-[120px] rounded-full -z-10 pointer-events-none"></div>
<script>
        // Micro-interaction: Form submission prevention and loading state simulation
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.style.opacity = '0.7';
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Logging in...';
            
            setTimeout(() => {
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.innerHTML = originalContent;
                // Add a small success toast logic or redirect simulation here
            }, 1500);
        });

        // Input field focus effects
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#0058be';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#727785';
            });
        });
    </script>
