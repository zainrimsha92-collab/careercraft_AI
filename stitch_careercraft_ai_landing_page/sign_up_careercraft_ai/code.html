<!-- Interaction Scripts -->
<script>
    // Add subtle hover tracking effect to the registration card
    const card = document.querySelector('.glass-card');
    document.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      // Only apply if near the card to save performance
      if (x > -100 && x < rect.width + 100 && y > -100 && y < rect.height + 100) {
        card.style.setProperty('--mouse-x', `${x}px`);
        card.style.setProperty('--mouse-y', `${y}px`);
      }
    });

    // Form submission animation mock
    const form = document.querySelector('form');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = form.querySelector('button[type="submit"]');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Processing...';
      btn.disabled = true;
      
      setTimeout(() => {
        btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Account Created!';
        btn.classList.replace('brand-gradient-bg', 'bg-tertiary-container');
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.disabled = false;
          btn.classList.replace('bg-tertiary-container', 'brand-gradient-bg');
        }, 2000);
      }, 1500);
    });
  </script>
